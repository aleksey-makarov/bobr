name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.97.1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      git_commit: ${{ steps.release.outputs.git_commit }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          [ -n "${version}" ] || { echo "failed to read workspace version" >&2; exit 1; }
          release_tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [ "${GITHUB_REF_NAME}" != "${release_tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${release_tag}" >&2
            exit 1
          fi
          {
            echo "git_commit=$(git rev-parse --verify HEAD)"
            echo "release_tag=${release_tag}"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >>"${GITHUB_OUTPUT}"

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  build-main-x86_64:
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    env:
      BOBR_BUILD_GIT_COMMIT: ${{ needs.prepare.outputs.git_commit }}
      BOBR_BUILD_GIT_DIRTY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl

      - name: Install musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends musl-tools

      # Same package list as tools/release-check-and-install.sh, which runs this
      # whole path locally before a tag is pushed. A binary missing here is not
      # caught by any test -- it surfaces in packaging after the tag.
      - name: Build static x86_64 release
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          [ "$(git rev-parse --verify HEAD)" = "${BOBR_BUILD_GIT_COMMIT}" ]
          [ -z "$(git status --porcelain=v1 --untracked-files=normal)" ]
          cargo build --release --locked \
            --target x86_64-unknown-linux-musl \
            -p bobr-build \
            -p bobr-repo \
            -p fsobj-hash \
            -p bobr-sandbox-launcher

      - name: Verify and package
        run: |
          .github/scripts/package-release.sh \
            "${{ needs.prepare.outputs.release_tag }}" \
            x86_64-unknown-linux-musl \
            "${{ needs.prepare.outputs.source_date_epoch }}" \
            dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-x86_64
          path: dist/bobr-x86_64-unknown-linux-musl.tar.xz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, test, build-main-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          archives=(
            bobr-x86_64-unknown-linux-musl.tar.xz
          )
          [ "$(find . -maxdepth 1 -type f -name '*.tar.xz' | wc -l)" -eq "${#archives[@]}" ]
          for archive in "${archives[@]}"; do
            [ -f "${archive}" ]
          done
          sha256sum "${archives[@]}" | LC_ALL=C sort -k2 >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: bobr ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-artifacts/*.tar.xz
            release-artifacts/SHA256SUMS
